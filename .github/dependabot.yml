version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'weekly-dependencies'
    cooldown:
      default-days: 3
    ignore:
      # biome.jsonc のスキーマURLと同時に更新するため、手動管理を維持する
      - dependency-name: '@biomejs/biome'
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'weekly-dependencies'
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
