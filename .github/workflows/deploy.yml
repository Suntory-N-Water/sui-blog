name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    name: preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - name: Enable preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/sui-blog/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
            -d '{"enabled": false, "previews_enabled": true}' \
            -o /dev/null
      - id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler versions upload --preview-alias "$PREVIEW_ALIAS" | tee upload.log
          alias_url="$(sed -n 's/^Version Preview Alias URL: //p' upload.log | head -n 1)"
          version_url="$(sed -n 's/^Version Preview URL: //p' upload.log | head -n 1)"
          if [ -z "$alias_url" ] || [ -z "$version_url" ]; then
            echo "::error::プレビュー URL を wrangler の出力から取得できませんでした"
            exit 1
          fi
          {
            echo "alias_url=$alias_url"
            echo "version_url=$version_url"
          } >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(printf '### プレビュー\n\n| 種類 | URL |\n|---|---|\n| この PR の最新 | %s |\n| このコミット (%s) | %s |\n\nmain へのデプロイでプレビュー URL は無効になります。\n' "$ALIAS_URL" "${HEAD_SHA:0:7}" "$VERSION_URL")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  production:
    name: production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
